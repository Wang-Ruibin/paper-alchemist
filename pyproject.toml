[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-alchemist"
version = "0.6.1"
description = "Codex academic writing with domain-specific corpus profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "misakimei0331" }]
keywords = ["agent-skills", "academic-writing", "paper", "bilingual", "distillation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pypdf>=6.10,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
]

[project.scripts]
paper-alchemist = "paper_alchemist.cli:main"

[project.urls]
Homepage = "https://github.com/Wang-Ruibin/paper-alchemist"
Repository = "https://github.com/Wang-Ruibin/paper-alchemist"
Issues = "https://github.com/Wang-Ruibin/paper-alchemist/issues"

[tool.setuptools]
packages = ["paper_alchemist"]
package-dir = { paper_alchemist = "engine" }

[tool.setuptools.data-files]
"share/paper-alchemist/skills/paper-alchemist" = ["skills/paper-alchemist/SKILL.md"]
"share/paper-alchemist/skills/paper-alchemist/agents" = ["skills/paper-alchemist/agents/openai.yaml"]
"share/paper-alchemist/skills/paper-alchemist/assets" = ["skills/paper-alchemist/assets/paper-context.example.yaml"]
"share/paper-alchemist/skills/paper-alchemist/assets/corpus" = [
  "skills/paper-alchemist/assets/corpus/*.json",
  "skills/paper-alchemist/assets/corpus/*.zip",
]
"share/paper-alchemist/skills/paper-alchemist/assets/corpus/copy-fingerprints" = [
  "skills/paper-alchemist/assets/corpus/copy-fingerprints/*.json",
]
"share/paper-alchemist/skills/paper-alchemist/references" = [
  "skills/paper-alchemist/references/generation.md",
  "skills/paper-alchemist/references/platforms.md",
  "skills/paper-alchemist/references/schemas.md",
  "skills/paper-alchemist/references/workflow.md",
  "skills/paper-alchemist/references/terminology.md",
  "skills/paper-alchemist/references/draft-audit.md",
  "skills/paper-alchemist/references/incremental.md",
  "skills/paper-alchemist/references/portable.md",
]
"share/paper-alchemist/skills/paper-alchemist/scripts" = ["skills/paper-alchemist/scripts/run.py"]
"share/paper-alchemist/skills/paper-alchemist/references/zh-CN" = ["skills/paper-alchemist/references/zh-CN/*.md"]
"share/paper-alchemist/runtime" = ["runtime/*"]
